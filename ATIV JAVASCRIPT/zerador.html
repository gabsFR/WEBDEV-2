<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


</head>

<body>

    <button id="botao"><img
            src="https://static.wikia.nocookie.net/cookieclicker/images/5/5a/PerfectCookie.png/revision/latest/scale-to-width-down/250?cb=20130827014912"
            alt=""></button>
    <button id="zerador">ZERAR COOKIES</button>

    <p id="contador-clicks"><br></p>

    <script>
        const contadorClicks = document.querySelector("#contador-clicks")
        const botao = document.querySelector("#botao")
        const zerador = document.querySelector("#zerador")
        let contador = 0

        botao.addEventListener("click", () => {
            contador++
            contadorClicks.innerText = contador + " Cookies"
        })

        zerador.addEventListener("click", () => {
            contador = 0
            contadorClicks.innerText = contador + " Cookies"

        })

    </script>

</body>

</html>
